services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mailforge
      POSTGRES_USER: mailforge
      POSTGRES_PASSWORD: mailforge
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  web:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      sh -c "pip install -e . &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      sh -c "pip install -e . &&
             celery -A mailforge worker -l info"
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
